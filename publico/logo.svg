<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Mundo em Questão">
  <defs>
    <!-- Ouro metalico do logo: claro em cima, escuro embaixo -->
    <linearGradient id="ouro" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#F2D98C"/>
      <stop offset="35%"  stop-color="#D4AF37"/>
      <stop offset="65%"  stop-color="#A8862A"/>
      <stop offset="100%" stop-color="#7A611C"/>
    </linearGradient>

    <linearGradient id="ouro2" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%"   stop-color="#FBF0C4"/>
      <stop offset="40%"  stop-color="#E0C064"/>
      <stop offset="100%" stop-color="#8A6C1E"/>
    </linearGradient>

    <!-- Azul dos oceanos -->
    <radialGradient id="oceano" cx="38%" cy="32%" r="78%">
      <stop offset="0%"   stop-color="#2E5C8A"/>
      <stop offset="55%"  stop-color="#16416B"/>
      <stop offset="100%" stop-color="#0A2440"/>
    </radialGradient>

    <!-- Recorte do globo -->
    <clipPath id="recorte">
      <circle cx="100" cy="100" r="62"/>
    </clipPath>
  </defs>

  <!-- ============================================================
       GLOBO
       ============================================================ -->
  <g clip-path="url(#recorte)">
    <circle cx="100" cy="100" r="62" fill="url(#oceano)"/>

    <!-- Continentes, em tom de areia -->
    <g fill="#C5A059" opacity=".92">
      <!-- America do Norte -->
      <path d="M52 62c8-7 19-9 28-5l6 8-5 5 3 6-8 3-6-4-6 2-4-6-8-2z"/>
      <!-- America do Sul -->
      <path d="M78 90l10 3 4 9-3 10-6 12-6-4 1-12-4-9z"/>
      <!-- Europa -->
      <path d="M112 62l12-3 9 5-4 6-9 1-6-4z"/>
      <!-- Africa -->
      <path d="M110 80l14 1 8 9-3 14-8 10-7-6-2-12-6-8z"/>
      <!-- Asia (recorte a direita) -->
      <path d="M138 66l16 4 6 12-8 5-10-4-6-9z"/>
    </g>

    <!-- Grade do globo: meridianos e paralelos -->
    <g fill="none" stroke="#D4AF37" stroke-width=".7" opacity=".42">
      <ellipse cx="100" cy="100" rx="62" ry="24"/>
      <ellipse cx="100" cy="100" rx="62" ry="44"/>
      <ellipse cx="100" cy="100" rx="24" ry="62"/>
      <ellipse cx="100" cy="100" rx="44" ry="62"/>
      <line x1="38" y1="100" x2="162" y2="100"/>
    </g>
  </g>

  <!-- Aro do globo -->
  <circle cx="100" cy="100" r="62" fill="none" stroke="url(#ouro)" stroke-width="3.5"/>

  <!-- ============================================================
       ROSA DOS VENTOS
       ============================================================ -->
  <g transform="translate(100 100)">
    <!-- Ponta principal (Norte), maior e mais afiada -->
    <path d="M0 -54 L7 -14 L0 -22 L-7 -14 Z" fill="url(#ouro2)"/>
    <!-- Pontas diagonais (menores) -->
    <path d="M26 -40 L8 -18 L17 -19 L22 -11 Z" fill="url(#ouro2)" opacity=".95"/>
    <path d="M40 -26 L18 -8 L19 -17 L11 -22 Z" fill="url(#ouro2)" opacity=".95"/>
    <path d="M-26 -40 L-8 -18 L-17 -19 L-22 -11 Z" fill="url(#ouro2)" opacity=".95"/>
    <path d="M-40 -26 L-18 -8 L-19 -17 L-11 -22 Z" fill="url(#ouro2)" opacity=".95"/>
    <!-- Ponta Sul, menor -->
    <path d="M0 54 L6 18 L0 25 L-6 18 Z" fill="url(#ouro2)"/>
    <!-- Esfera central -->
    <circle cx="0" cy="0" r="7.5" fill="url(#ouro)"/>
    <circle cx="-2" cy="-2" r="2.6" fill="#FBF0C4" opacity=".9"/>
  </g>

  <!-- ============================================================
       ANEL EXTERNO (a gaiola de metal)
       ============================================================ -->
  <g fill="none" stroke="url(#ouro)" stroke-width="2.2">
    <circle cx="100" cy="100" r="88"/>
    <circle cx="100" cy="100" r="82"/>
  </g>
  <g stroke="url(#ouro)" stroke-width="1.5" opacity=".9">
    <line x1="100" y1="12" x2="100" y2="18"/>
    <line x1="100" y1="182" x2="100" y2="188"/>
    <line x1="12"  y1="100" x2="18"  y2="100"/>
    <line x1="182" y1="100" x2="188" y2="100"/>
    <line x1="39"  y1="39"  x2="43"  y2="43"/>
    <line x1="157" y1="39"  x2="161" y2="43"/>
    <line x1="39"  y1="161" x2="43"  y2="157"/>
    <line x1="157" y1="161" x2="161" y2="157"/>
  </g>
</svg>
